  <rect x="232" y="100" width="48" height="240" fill="url(#steel)"/>
  <rect x="190" y="338" width="132" height="21" rx="6" fill="#c21626"/>
  <rect x="198" y="343" width="116" height="5" fill="#ff5a64"/>
  <rect x="245" y="359" width="22" height="71" rx="7" fill="#1b1218"/>
  <g fill="#38242c">
    <rect x="243" y="367" width="26" height="6" rx="3"/>
    <rect x="243" y="382" width="26" height="6" rx="3"/>
    <rect x="243" y="397" width="26" height="6" rx="3"/>
    <rect x="243" y="412" width="26" height="6" rx="3"/>
  </g>
  <rect x="236" y="429" width="40" height="22" rx="8" fill="#c21626"/>
</svg>
