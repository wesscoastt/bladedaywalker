<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="66%">
      <stop offset="0" stop-color="#640c18"/>
      <stop offset="1" stop-color="#060308"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#9aa2b8"/>
      <stop offset="0.42" stop-color="#f2f6ff"/>
      <stop offset="0.72" stop-color="#9aa2b8"/>
      <stop offset="1"    stop-color="#6a718c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- blood slash -->
  <g filter="url(#glow)" opacity="0.85">
    <polygon points="75,405 430,75 442,117 105,440" fill="#d01222"/>
  </g>
  <polygon points="75,405 430,75 442,117 105,440" fill="#d01222"/>
  <polygon points="107,432 425,117 434,140 130,447" fill="#ff4450" opacity="0.8"/>

